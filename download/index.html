<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>软件下载</title>
  <meta content="软件包下载页：Android / Windows / macOS 安装包。" name="description">

  <!-- 字体（公共 CDN） -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Raleway:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- 站点主题 + 独立下载页样式 -->
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/download.css" rel="stylesheet">
</head>

<body class="download-page">

  <!-- ======= 顶部：返回首页 ======= -->
  <header class="dl-hero">
    <div class="dl-shell">
      <div class="dl-hero__top">
        <a href="../" class="dl-back">
          <span class="dl-back__arrow" aria-hidden="true">←</span> 返回首页
        </a>
      </div>

      <div class="dl-hero__body">
        <span class="dl-kicker">APP Download</span>
        <h1 id="pageTitle">软件下载</h1>
        <p class="dl-hero__lead" id="pageSubtitle"></p>
      </div>
    </div>
  </header>

  <!-- ======= 主体：居中卡片列表 ======= -->
  <main class="dl-main">
    <div class="dl-shell">
      <div class="dl-wrap">
        <p class="dl-note" id="pageNote"></p>
        <div class="pkg-list" id="pkgList">
          <div class="text-center text-muted py-5">列表加载中…</div>
        </div>
      </div>
    </div>
  </main>

  <!-- ======= 页脚 ======= -->
  <footer class="dl-footer">
    <p>© <span>2026</span> · All Rights Reserved</p>
    <a class="dl-footer__link" href="../"><span aria-hidden="true">←</span> 返回首页</a>
  </footer>

  <!-- 回到顶部 -->
  <a href="#" id="scrollTop" class="scroll-top" aria-label="回到顶部">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 12V4m0 0L4 8m4-4l4 4" stroke="#fff" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </a>

  <script src="../assets/js/download.js"></script>
  <script>
    (function () {
      'use strict';
      var top = document.getElementById('scrollTop');
      if (!top) return;
      top.addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      window.addEventListener('scroll', function () {
        top.classList.toggle('active', window.scrollY > 400);
      }, { passive: true });
    })();
  </script>
</body>

</html>
